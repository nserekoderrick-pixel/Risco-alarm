name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o RiscoProSysController.zip

      - name: Ensure gradle.properties has required flags
        working-directory: RiscoProSysController
        run: |
          touch gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          cat gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper pinned to 8.7
        working-directory: RiscoProSysController
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: RiscoProSysController
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: risco-prosys-debug-apk
          path: RiscoProSysController/app/build/outputs/apk/debug/*.apk
