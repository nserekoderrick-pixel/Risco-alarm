name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unzip project if delivered as a zip
        run: |
          if [ -f RiscoProSysController.zip ] && [ ! -f RiscoProSysController/settings.gradle.kts ]; then
            unzip -o RiscoProSysController.zip
          fi

      - name: Ensure gradle.properties has required AndroidX flags
        working-directory: RiscoProSysController
        run: |
          touch gradle.properties
          grep -q "android.useAndroidX" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          grep -q "android.enableJetifier" gradle.properties || echo "android.enableJetifier=false" >> gradle.properties
          cat gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper pinned to 8.7
        working-directory: RiscoProSysController
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: RiscoProSysController
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: risco-prosys-debug-apk
          path: RiscoProSysController/app/build/outputs/apk/debug/*.apk
