name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unzip project if delivered as a zip
        run: |
          if [ -f RiscoProSysController.zip ] && [ ! -f RiscoProSysController/settings.gradle.kts ]; then
            unzip -o RiscoProSysController.zip
          fi8

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
  with:
    gradle-version: '8.7'

      - name: Build debug APK
        working-directory: RiscoProSysController
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: risco-prosys-debug-apk
          path: RiscoProSysController/app/build/outputs/apk/debug/*.apk
